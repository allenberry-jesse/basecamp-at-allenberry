# Netlify configuration — Basecamp at Allenberry
# Static site, no build step.

[build]
  publish = "."
  command = ""

# Sensible defaults for a static marketing page
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "SAMEORIGIN"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "camera=(), microphone=(), geolocation=()"

# Long-cache the assets folder; HTML stays fresh
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# v2 folded care.html into the landing page; keep old links working
[[redirects]]
  from = "/care.html"
  to = "/#care"
  status = 301

[[redirects]]
  from = "/care"
  to = "/#care"
  status = 301
